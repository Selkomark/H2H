# H2H configuration.
#
# Set this file up in a conversation with "/config" inside h2h, or edit it
# yourself with "/config --manual". Either way H2H validates the result and
# shows the difference before anything is applied.

# The harness H2H uses when none is named: for new sessions, and to answer
# text typed into the h2h console. It must be one of the harnesses below.
default_harness = "claude"

# One table per harness H2H may start.
#
#   command   the program to run
#   args      arguments for an interactive session
#   ask_args  arguments for a single non-interactive answer; the prompt is
#             appended as the last argument. Where the harness has a
#             read-only mode it is used here, because answering a question
#             should not change the project
#   permit_args
#             arguments added to a session so the harness asks H2H, through
#             its own permission hook, instead of stopping at a prompt in
#             its terminal. {permit} is the program the hook runs. What H2H
#             answers is set under [permissions] below
#   state_args, state_env, state_files
#             the harness's own hooks that tell H2H when a session stops to
#             wait for you, at a permission prompt or a question, and when
#             it carries on, so the console can say so. A hook runs {state}
#             with "wait" or "go". The hook for a submitted prompt must run
#             "go": from it H2H learns that a request it typed arrived, and
#             it tells you when one did not. state_files are written into a
#             folder of the session's own in H2H's state directory, named by
#             {state_dir}, for a harness that reads hooks from files such as
#             a plugin. Nothing is written into the workspace
#   no_wait_signal
#             true for a harness with no hook that tells H2H it waits for
#             you. H2H then goes by its terminal being silent while a
#             request from H2H is open, and says only that it may be waiting
#   report_args
#             arguments added to a session so the harness may run
#             "h2h-report", the command it answers a delegated request
#             with, without stopping to ask you. Nothing else is allowed
#             by them
#   stream_args, stream_text, stream_when, stream_whole
#             how to get that answer while it is being written, so the
#             console shows it as it arrives. stream_args replace ask_args
#             and make the harness print JSON, one object per line.
#             stream_text says where the text is in a line, as keys joined
#             by dots. stream_when, as keys=value, limits it to the lines
#             that carry the answer. stream_whole = true says each piece is
#             a whole message, for a harness that does not send parts
#   conversation_args, resume_args, conversation_key
#             how the default harness keeps one conversation going for each
#             console session, so it remembers what was said before. Each
#             list replaces stream_args for one answer: conversation_args
#             start a conversation, and resume_args continue it.
#             {conversation} in them is the conversation's ID. A harness
#             that chooses its own ID has conversation_key instead, which
#             says where its JSON output reports it, as keys joined by dots.
#             "/clear" in the console starts a new conversation
#   version_args
#             arguments that make the harness print its version and exit.
#             "/doctor" runs them to check that the program really works
#   install_command, latest_command
#             whole commands, program first. install_command installs the
#             latest version of the harness, or updates it. latest_command
#             prints the latest version there is. "/install" runs them, and
#             only after you choose what to install
#   trust_file, trust_key, trust_value
#             where the harness records that you trust a folder, so that
#             "/doctor" can tell whether it will stop to ask.
#             trust_file is JSON or TOML, trust_key is the path of keys to
#             the record, and trust_value is what the record holds, or one
#             entry of it if it is a list, when the folder is trusted.
#             {project} is the project's path. H2H only reads this file.
#             trust_covers_subfolders = true says that trusting a folder
#             covers every folder inside it, repositories of their own
#             included; otherwise only a record for the project counts.
#             H2H types a request into a session only where this record, or
#             no_trust_question, says no trust question can be waiting
#   no_trust_question
#             true for a harness that starts in any folder without asking
#             whether you trust it. There is then nothing for "/doctor" to
#             check, and no trust settings are needed
#   pass_env  extra environment variables the harness may see. A harness
#             otherwise gets only a basic environment (HOME, PATH, TERM,
#             locale, proxy settings), never your whole shell environment.
#   session_env
#             NAME=value entries set for a session, to turn off a question
#             the harness would put on its screen by itself, such as one it
#             asks the first time it runs in a terminal. A request H2H types
#             while such a question is open goes to the question and is lost
#   context_args, context_env
#             how a session started for a domain is told its role. In
#             context_args, {roles} becomes the roles as XML. In context_env
#             (NAME=value entries), {roles_dir} becomes a directory holding
#             the roles as AGENTS.md, for harnesses that read instructions
#             only from files. Each harness below uses the option it has
#             for standing instructions, so all of them get the same role.

[harness.claude]
command = "claude"
args = []
ask_args = ["--permission-mode", "manual", "--tools", "Read,Glob,Grep", "--strict-mcp-config", "-p"]
context_args = ["--append-system-prompt", "{roles}"]
permit_args = ["--settings", '{"hooks":{"PermissionRequest":[{"matcher":"*","hooks":[{"type":"command","command":"{permit}","timeout":600}]}]}}']
state_args = ["--plugin-dir", "{state_dir}"]
state_files = { ".claude-plugin/plugin.json" = "{\"name\":\"h2h-state\",\"version\":\"1.0.0\",\"description\":\"Tells H2H when this session waits for the user\"}", "hooks/hooks.json" = "{\"hooks\":{\"Notification\":[{\"matcher\":\"permission_prompt|elicitation_dialog\",\"hooks\":[{\"type\":\"command\",\"command\":\"'{state}' wait\",\"timeout\":10}]}],\"PostToolUse\":[{\"hooks\":[{\"type\":\"command\",\"command\":\"'{state}' go\",\"timeout\":10}]}],\"PostToolUseFailure\":[{\"hooks\":[{\"type\":\"command\",\"command\":\"'{state}' go\",\"timeout\":10}]}],\"UserPromptSubmit\":[{\"hooks\":[{\"type\":\"command\",\"command\":\"'{state}' go\",\"timeout\":10}]}],\"Stop\":[{\"hooks\":[{\"type\":\"command\",\"command\":\"'{state}' go\",\"timeout\":10}]}]}}" }
report_args = ["--allowedTools", "Bash(h2h-report:*)"]
stream_args = ["--permission-mode", "manual", "--tools", "Read,Glob,Grep", "--strict-mcp-config", "-p", "--output-format", "stream-json", "--include-partial-messages", "--verbose"]
stream_text = "event.delta.text"
conversation_args = ["--permission-mode", "manual", "--tools", "Read,Glob,Grep", "--strict-mcp-config", "-p", "--output-format", "stream-json", "--include-partial-messages", "--verbose", "--session-id", "{conversation}"]
resume_args = ["--permission-mode", "manual", "--tools", "Read,Glob,Grep", "--strict-mcp-config", "-p", "--output-format", "stream-json", "--include-partial-messages", "--verbose", "--resume", "{conversation}"]
version_args = ["--version"]
install_command = ["npm", "install", "-g", "@anthropic-ai/claude-code@latest"]
latest_command = ["npm", "view", "@anthropic-ai/claude-code", "version"]
trust_file = "~/.claude.json"
trust_key = ["projects", "{project}", "hasTrustDialogAccepted"]
trust_value = "true"
pass_env = ["ANTHROPIC_API_KEY", "CLAUDE_CODE_OAUTH_TOKEN"]

[harness.copilot]
command = "copilot"
args = []
ask_args = ["-p"]
context_env = ["COPILOT_CUSTOM_INSTRUCTIONS_DIRS={roles_dir}"]
report_args = ["--allow-tool", "shell(h2h-report:*)"]
state_args = ["--plugin-dir", "{state_dir}"]
state_files = { "plugin.json" = "{\"name\":\"h2h-state\",\"version\":\"1.0.0\",\"description\":\"Tells H2H when this session waits for the user\"}", "hooks/hooks.json" = "{\"version\":1,\"hooks\":{\"notification\":[{\"type\":\"command\",\"bash\":\"'{state}' wait permission_prompt elicitation_dialog\",\"timeoutSec\":10}],\"postToolUse\":[{\"type\":\"command\",\"bash\":\"'{state}' go\",\"timeoutSec\":10}],\"userPromptSubmitted\":[{\"type\":\"command\",\"bash\":\"'{state}' go\",\"timeoutSec\":10}],\"agentStop\":[{\"type\":\"command\",\"bash\":\"'{state}' go\",\"timeoutSec\":10}]}}" }
stream_args = ["--output-format", "json", "--stream", "on", "-p"]
stream_text = "data.deltaContent"
conversation_args = ["--session-id", "{conversation}", "--output-format", "json", "--stream", "on", "-p"]
resume_args = ["--session-id", "{conversation}", "--output-format", "json", "--stream", "on", "-p"]
version_args = ["--version"]
install_command = ["npm", "install", "-g", "@github/copilot@latest"]
latest_command = ["npm", "view", "@github/copilot", "version"]
trust_file = "~/.copilot/config.json"
trust_key = ["trustedFolders"]
trust_value = "{project}"
trust_covers_subfolders = true
pass_env = ["COPILOT_GITHUB_TOKEN", "GH_TOKEN", "GITHUB_TOKEN"]
# Copilot offers to set up a shift+enter key binding the first time it runs
# in VS Code, Cursor, Windsurf or Windows Terminal, which it finds among the
# programs that started it, the h2h console's terminal included.
session_env = ["COPILOT_SETUP_TERMINAL=false"]

[harness.codex]
command = "codex"
args = []
ask_args = ["exec", "--sandbox", "read-only"]
context_args = ["-c", "developer_instructions={roles}"]
state_args = ["-c", "hooks.PermissionRequest=[{hooks=[{type=\"command\",command=\"'{state}' wait\",timeout=10}]}]", "-c", "hooks.PostToolUse=[{hooks=[{type=\"command\",command=\"'{state}' go\",timeout=10}]}]", "-c", "hooks.UserPromptSubmit=[{hooks=[{type=\"command\",command=\"'{state}' go\",timeout=10}]}]", "-c", "hooks.Stop=[{hooks=[{type=\"command\",command=\"'{state}' go\",timeout=10}]}]", "--dangerously-bypass-hook-trust"]
stream_args = ["exec", "--sandbox", "read-only", "--json"]
stream_text = "item.text"
stream_when = "item.type=agent_message"
stream_whole = true
conversation_key = "thread_id"
resume_args = ["exec", "resume", "-c", 'sandbox_mode="read-only"', "--json", "{conversation}"]
version_args = ["--version"]
install_command = ["npm", "install", "-g", "@openai/codex@latest"]
latest_command = ["npm", "view", "@openai/codex", "version"]
trust_file = "~/.codex/config.toml"
trust_key = ["projects", "{project}", "trust_level"]
trust_value = "trusted"
pass_env = ["OPENAI_API_KEY"]

[harness.opencode]
command = "opencode"
args = ["--standalone"]
ask_args = ["run", "--standalone", "--agent", "plan"]
context_env = ['OPENCODE_CONFIG_CONTENT={"instructions":["{roles_dir}/AGENTS.md"]}']
no_wait_signal = true
stream_args = ["run", "--standalone", "--agent", "plan", "--format", "json"]
stream_text = "part.text"
stream_when = "type=text"
stream_whole = true
conversation_args = ["run", "--standalone", "--agent", "plan", "--format", "json", "--session", "ses_{conversation}"]
resume_args = ["run", "--standalone", "--agent", "plan", "--format", "json", "--session", "ses_{conversation}"]
version_args = ["--version"]
install_command = ["npm", "install", "-g", "@opencode/cli@latest"]
latest_command = ["npm", "view", "@opencode/cli", "version"]
no_trust_question = true
pass_env = ["OPENCODE_API_KEY"]

# Grok. Its read-only runs name the permission mode, because a user's own
# setting may approve everything, and leave it only its reading tools, with
# MCP tools denied. It has no way to take hooks at launch, so H2H cannot be
# told when a session waits. A session uses your own permission setting.
[harness.grok]
command = "grok"
args = []
ask_args = ["--permission-mode", "default", "--tools", "read_file,grep,list_dir", "--deny", "MCPTool", "--no-subagents", "--disable-web-search", "-p"]
context_args = ["--rules", "{roles}"]
report_args = ["--allow", "Bash(h2h-report*)"]
no_wait_signal = true
stream_args = ["--permission-mode", "default", "--tools", "read_file,grep,list_dir", "--deny", "MCPTool", "--no-subagents", "--disable-web-search", "--output-format", "streaming-messages-json", "--include-partial-messages", "-p"]
stream_text = "event.delta.text"
conversation_args = ["--permission-mode", "default", "--tools", "read_file,grep,list_dir", "--deny", "MCPTool", "--no-subagents", "--disable-web-search", "--output-format", "streaming-messages-json", "--include-partial-messages", "--session-id", "{conversation}", "-p"]
resume_args = ["--permission-mode", "default", "--tools", "read_file,grep,list_dir", "--deny", "MCPTool", "--no-subagents", "--disable-web-search", "--output-format", "streaming-messages-json", "--include-partial-messages", "--resume", "{conversation}", "-p"]
version_args = ["--version"]
install_command = ["bash", "-c", "set -o pipefail; curl -fsSL https://x.ai/cli/install.sh | bash"]
latest_command = ["sh", "-c", 'grok update --check --json | sed -n "s/.*\"latestVersion\": *\"\([^\"]*\)\".*/\1/p"']
trust_file = "~/.grok/trusted_folders.toml"
trust_key = ["folders", "{project}", "trusted"]
trust_value = "true"
pass_env = ["XAI_API_KEY"]

# What a harness may do without stopping to ask you. A harness with
# permit_args asks H2H first, and H2H answers from these rules:
#
#   mode   what happens when no rule covers the request. "ask" (the
#          default) puts it to you in a dialog in the h2h console, where you
#          allow it once, allow it for the rest of that harness's session,
#          or refuse it. "auto" allows it without asking
#   allow  what runs without asking, as patterns. A pattern is matched
#          against each command of a shell command line, or for another
#          tool its name followed by what it acts on, such as
#          "Edit web/app.tsx". A * stands for any text. A command that
#          writes to a file with > or runs another command inside $( ) is
#          never allowed by a pattern.
#          Paths are written so the rules work wherever the project is
#          cloned: "./" is the harness's own working copy of the project,
#          as in "Edit ./web/*", and {project} is the project's folder, as
#          in "git -C {project} status*". A path anywhere else is written
#          in full
#   deny   what is always refused, also in auto mode. Deny wins over allow
#
# For example:
#
# [permissions]
# mode = "ask"
# allow = ["git status*", "git diff*", "git log*", "npm test*", "Edit ./*"]
# deny = ["git push*", "*rm -rf*"]

# Domains of responsibility. Each is owned by one harness above, lists the
# sub-agent roles that harness should use as specialists, and names the
# domains whose work it depends on. A domain with no depends_on runs in
# parallel with the rest. "/start <domain>" starts its owner with its role,
# and "/map" draws all of it. For example:
#
# [domain.ui]
# harness = "claude"
# does = "The web frontend"
# paths = ["web/**"]
#   [[domain.ui.subagent]]
#   role = "coder"
#   does = "Writes the components"
#   [[domain.ui.subagent]]
#   role = "reviewer"
#
# [domain.e2e]
# harness = "copilot"
# does = "End-to-end tests across the app"
# depends_on = ["ui", "backend"]
